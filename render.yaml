services:
  - type: web
    name: ai-invoice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    envVars:
      - key: A2A_BASE_URL
        value: https://ai-invoice-agent-m1qm.onrender.com
      - key: ACCEPT_ANY_BEARER
        value: "true"
      - key: A2A_BEARER_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://aipipe.org/openrouter/v1
      - key: OPENAI_MODEL
        value: google/gemini-2.5-flash-lite
      - key: DATABASE_PATH
        value: /tmp/invoice_agent.sqlite3
